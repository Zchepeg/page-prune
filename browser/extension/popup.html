<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PagePrune</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="status-dot" aria-hidden="true"></span>
        <strong>PagePrune</strong>
        <span id="version" class="version"></span>
      </header>
      <button id="picker" type="button">点选并标记广告</button>
      <label class="screenshot-option"><input id="audit-mode" type="checkbox" autocomplete="off"> 改为截图复核</label>
      <p id="picker-status" role="status" hidden></p>
      <p>重新加载扩展后，请刷新已经打开的网页。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
